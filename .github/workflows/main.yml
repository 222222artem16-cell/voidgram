name: Setup and build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q -o voidgram.zip -d _x

      - name: Copy project files
        run: rm -rf _x/voidgram/.github && cp -a _x/voidgram/. ./ && rm -rf _x

      - name: Fix missing import
        run: sed -i '/^package app.voidgram/a import kotlinx.serialization.json.decodeFromJsonElement' android/app/src/main/java/app/voidgram/Api.kt android/app/src/main/java/app/voidgram/AppModel.kt

      - name: Save unpacked files to repo
        run: git add -A && (git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -m unpack && git push || true)

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon > build.log 2>&1 || (echo ERRORS-START; grep -E "^e:|What went wrong|Could not|not found" -A5 build.log | head -50; echo ERRORS-END; exit 1)

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk voidgram.apk

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Voidgram build ${{ github.run_number }}
          files: voidgram.apk
