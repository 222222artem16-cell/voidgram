name: Setup and build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack voidgram.zip into the repository
        run: |
          test -f voidgram.zip || { echo "voidgram.zip not found in repo root"; exit 1; }
          rm -rf _x && mkdir _x && unzip -q voidgram.zip -d _x
          rm -rf _x/voidgram/.github
          cp -a _x/voidgram/. ./
          rm -rf _x
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; the
